<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 370" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="Diagrama de componentes de CaféApp: teléfono del productor y servidor conectados por la interfaz ICosechasAPI">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333"/></marker>
    <g id="ico"><rect x="0" y="0" width="14" height="16" fill="#fff" stroke="#333" stroke-width="1.2"/><rect x="-4" y="3" width="8" height="3.5" fill="#fff" stroke="#333" stroke-width="1"/><rect x="-4" y="9.5" width="8" height="3.5" fill="#fff" stroke="#333" stroke-width="1"/></g>
  </defs>
  <rect width="1000" height="370" fill="#fff"/>

  <!-- Dispositivo: Servidor -->
  <rect x="20" y="30" width="340" height="260" rx="6" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.6"/>
  <text x="190" y="54" text-anchor="middle" font-size="14" font-weight="700" fill="#4a148c">«device» Servidor CaféApp</text>

  <rect x="40" y="170" width="140" height="60" rx="4" fill="#e1bee7" stroke="#7b1fa2" stroke-width="1.5"/>
  <use href="#ico" x="160" y="176"/>
  <text x="105" y="196" text-anchor="middle" font-size="13" font-weight="600">API REST</text>
  <text x="105" y="214" text-anchor="middle" font-size="13" font-weight="600">Cosechas</text>

  <rect x="220" y="80" width="120" height="50" rx="4" fill="#ffe0b2" stroke="#ef6c00" stroke-width="1.5"/>
  <use href="#ico" x="320" y="86"/>
  <text x="275" y="110" text-anchor="middle" font-size="13" font-weight="600">PostgreSQL</text>

  <rect x="220" y="170" width="120" height="60" rx="4" fill="#e1bee7" stroke="#7b1fa2" stroke-width="1.5"/>
  <use href="#ico" x="320" y="176"/>
  <text x="275" y="196" text-anchor="middle" font-size="13" font-weight="600">Servicio de</text>
  <text x="275" y="214" text-anchor="middle" font-size="13" font-weight="600">Autenticación</text>

  <path d="M180 200 H218" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <rect x="184" y="182" width="32" height="15" rx="2" fill="#f3e5f5"/><text x="200" y="193" text-anchor="middle" font-size="11">JAuth</text>
  <path d="M150 170 V105 H218" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <text x="185" y="99" text-anchor="middle" font-size="11">SQL</text>

  <!-- Dispositivo: Teléfono -->
  <rect x="410" y="30" width="570" height="260" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.6"/>
  <text x="695" y="54" text-anchor="middle" font-size="14" font-weight="700" fill="#0d47a1">«device» Teléfono del productor</text>

  <rect x="430" y="100" width="140" height="60" rx="4" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <use href="#ico" x="550" y="106"/>
  <text x="500" y="126" text-anchor="middle" font-size="13" font-weight="600">Pantalla de</text>
  <text x="500" y="144" text-anchor="middle" font-size="13" font-weight="600">Registro</text>

  <rect x="640" y="200" width="150" height="60" rx="4" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <use href="#ico" x="770" y="206"/>
  <text x="715" y="226" text-anchor="middle" font-size="13" font-weight="600">Módulo de</text>
  <text x="715" y="244" text-anchor="middle" font-size="13" font-weight="600">Sincronización</text>

  <rect x="826" y="90" width="146" height="70" rx="4" fill="#ffe0b2" stroke="#ef6c00" stroke-width="1.5"/>
  <use href="#ico" x="954" y="96"/>
  <text x="892" y="118" text-anchor="middle" font-size="13" font-weight="600">Almacenamiento</text>
  <text x="892" y="135" text-anchor="middle" font-size="13" font-weight="600">Local</text>
  <text x="892" y="152" text-anchor="middle" font-size="12">(SQLite)</text>

  <path d="M570 120 H824" stroke="#333" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#ar)"/>
  <text x="705" y="113" text-anchor="middle" font-size="11">IAlmacenamiento</text>
  <path d="M570 145 H605 V230 H638" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <text x="560" y="222" text-anchor="middle" font-size="11">requerimiento</text>
  <path d="M790 230 H900 V162" stroke="#333" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#ar)"/>
  <text x="850" y="222" text-anchor="middle" font-size="11">leer datos</text>

  <!-- Interfaz ICosechasAPI: provista (paleta) por la API, requerida (enchufe) por el Módulo -->
  <path d="M105 230 V330 H379" stroke="#333" stroke-width="1.5" fill="none"/>
  <circle cx="385" cy="330" r="6" fill="#fff" stroke="#333" stroke-width="1.6"/>
  <path d="M385 318 A12 12 0 0 1 385 342" stroke="#333" stroke-width="1.6" fill="none"/>
  <path d="M397 330 H715 V262" stroke="#333" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>
  <text x="240" y="322" text-anchor="middle" font-size="11">provee: ICosechasAPI</text>
  <text x="560" y="322" text-anchor="middle" font-size="11">requiere: ICosechasAPI (REST/JSON)</text>
  <text x="385" y="360" text-anchor="middle" font-size="11" font-weight="600">ICosechasAPI</text>
</svg>
